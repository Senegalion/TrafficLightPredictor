# Local demo of the full stack. Copy .env.example to .env first.
#
#   docker compose up --build
#
# UI: http://localhost:${FRONTEND_PORT:-3000}   API docs: http://localhost:${BACKEND_PORT:-8080}/swagger-ui.html

name: traffic-light-predictor

services:
  db:
    # Multi-arch build of the official postgis/postgis image (the official one is amd64-only).
    image: ${POSTGIS_IMAGE:-imresamu/postgis:17-3.5}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  ml-service:
    build: ./ml
    environment:
      TLP_LOG_FORMAT: json
    ports:
      - "${ML_PORT:-8000}:8000"

  backend:
    build: ./backend
    environment:
      TLP_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      TLP_DB_USER: ${POSTGRES_USER}
      TLP_DB_PASSWORD: ${POSTGRES_PASSWORD}
      TLP_ML_BASE_URL: http://ml-service:8000
      TLP_INGEST_API_KEY: ${TLP_INGEST_API_KEY:?set TLP_INGEST_API_KEY in .env}
      TLP_CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://localhost:5173
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        # The backend degrades gracefully (MODEL_UNAVAILABLE) if the ML service is down.
        condition: service_started

  simulator:
    # Posts SIMULATED observations (simulated=true, source=demo-simulator) to the backend,
    # standing in for a real data collector. Disable it to work with real data only.
    build: ./ml
    command: ["tlp-ml", "simulate-feed"]
    environment:
      TLP_BACKEND_URL: http://backend:8080
      TLP_INGEST_API_KEY: ${TLP_INGEST_API_KEY}
      TLP_FEED_BACKFILL_MINUTES: ${TLP_FEED_BACKFILL_MINUTES:-120}
      TLP_LOG_FORMAT: json
    healthcheck:
      disable: true
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
