[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tlp-ml"
version = "0.1.0"
description = "Traffic Light Predictor - ML pipeline, prediction service and simulated observation feed (research prototype)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "joblib>=1.4,<2",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[project.scripts]
tlp-ml = "tlp_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tlp_ml = ["simulation/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
